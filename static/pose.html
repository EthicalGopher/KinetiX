<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body, html { width: 100%; height: 100%; overflow: hidden; background-color: #0F172A; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    #container { position: relative; width: 100vw; height: 100vh; display: flex; justify-content: center; align-items: center; background-color: #000; }
    video { position: absolute; width: 100%; height: 100%; object-fit: contain; transform: scaleX(-1); }
    canvas { position: absolute; width: 100%; height: 100%; object-fit: contain; transform: scaleX(-1); pointer-events: none; }
    
    #squat-hud {
      position: absolute; z-index: 10; top: 16px; left: 16px; min-width: 190px;
      padding: 12px 14px; border: 1px solid rgba(255,255,255,.16);
      border-radius: 14px; background: rgba(15,23,42,.78); color: #F8FAFC;
      font-size: 12px; line-height: 1.7; backdrop-filter: blur(10px);
    }
    #squat-hud strong { color: #93C5FD; }
    #squat-state { font-weight: 800; color: #60A5FA; }
    #squat-depth { font-weight: 700; color: #F59E0B; }

    #squat-state-pill {
      position: absolute; z-index: 10; top: 16px; left: 50%; transform: translateX(-50%);
      padding: 8px 22px; border-radius: 24px; font-weight: 800; font-size: 13px;
      letter-spacing: 0.8px; text-transform: uppercase; display: flex; align-items: center;
      gap: 8px; backdrop-filter: blur(12px); border: 1px solid rgba(255,255,255,0.2);
      box-shadow: 0 4px 16px rgba(0,0,0,0.4); transition: all 0.2s ease;
    }
    .state-top { background: rgba(37, 99, 235, 0.85); color: #FFFFFF; border-color: #60A5FA; }
    .state-down { background: rgba(245, 158, 11, 0.85); color: #FFFFFF; border-color: #FCD34D; }
    .state-bottom { background: rgba(16, 185, 129, 0.9); color: #FFFFFF; border-color: #34D399; }
    
    #loader-overlay {
      position: absolute; z-index: 20; width: 85%; max-width: 360px;
      background: rgba(30, 41, 59, 0.94); border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 24px; padding: 24px; text-align: center; color: #F8FAFC;
      box-shadow: 0 12px 32px rgba(0, 0, 0, 0.5); backdrop-filter: blur(16px);
      transition: opacity 0.4s ease, transform 0.4s ease;
    }
    .loader-icon { font-size: 36px; margin-bottom: 12px; display: inline-block; }
    .loader-title { font-size: 18px; font-weight: 700; color: #F8FAFC; margin-bottom: 6px; }
    .loader-status { font-size: 13px; color: #94A3B8; margin-bottom: 16px; min-height: 20px; line-height: 18px; }
    
    .progress-track {
      width: 100%; height: 10px; background-color: #0F172A; border-radius: 10px;
      overflow: hidden; border: 1px solid rgba(255, 255, 255, 0.1); margin-bottom: 8px;
    }
    .progress-fill {
      height: 100%; width: 5%; background: linear-gradient(90deg, #6366F1, #818CF8);
      border-radius: 10px; transition: width 0.25s ease;
    }
    .progress-percentage { font-size: 12px; font-weight: 600; color: #818CF8; text-align: right; }
    
    #retry-btn {
      display: none; margin-top: 14px; background-color: #6366F1; color: #fff;
      border: none; padding: 10px 20px; border-radius: 20px; font-weight: 600;
      font-size: 13px; cursor: pointer;
    }
  </style>

  <!-- MediaPipe Libraries -->
  <script src="/static/camera_utils.js"></script>
  <script src="/static/pose.js"></script>
</head>
<body>
  <div id="container">
    <div id="loader-overlay">
      <div class="loader-icon" id="loader-icon">📦</div>
      <div class="loader-title">Loading Pose Model</div>
      <div class="loader-status" id="loader-status-text">Connecting to Backend Server...</div>
      
      <div class="progress-track">
        <div class="progress-fill" id="progress-bar-fill"></div>
      </div>
      <div class="progress-percentage" id="progress-pct-text">10%</div>
      
      <button id="retry-btn" onclick="location.reload()">🔄 Retry</button>
    </div>

    <video id="video" playsinline webkit-playsinline muted></video>
    <canvas id="canvas"></canvas>

    <div id="squat-state-pill" class="state-top">
      <span id="squat-state-emoji">🟢</span>
      <span id="squat-state-text">TOP</span>
    </div>

    <div id="squat-hud">
      <div><strong>STATE</strong> <span id="squat-state">TOP</span></div>
      <div><strong>DEPTH</strong> <span id="squat-depth">Standing</span></div>
      <div><strong>REPS</strong> <span id="squat-reps">0</span></div>
      <div><strong>KNEE</strong> <span id="squat-knee">--</span></div>
      <div><strong>HIP</strong> <span id="squat-hip">--</span></div>
      <div><strong>VISIBILITY</strong> <span id="squat-visibility">--</span></div>
    </div>
  </div>

  <script>
    const video = document.getElementById('video');
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    const loaderOverlay = document.getElementById('loader-overlay');
    const statusText = document.getElementById('loader-status-text');
    const progressFill = document.getElementById('progress-bar-fill');
    const pctText = document.getElementById('progress-pct-text');
    const retryBtn = document.getElementById('retry-btn');
    const loaderIcon = document.getElementById('loader-icon');

    let currentProgress = 10;
    let poseInstance = null;
    let selectedComplexity = 1;
    let lastFramePostTime = 0;
    let offscreenCanvas = null;

    function setProgress(pct, statusMsg, isError = false) {
      currentProgress = Math.max(currentProgress, Math.min(100, pct));
      progressFill.style.width = currentProgress + '%';
      pctText.innerText = Math.round(currentProgress) + '%';
      if (statusMsg) {
        statusText.innerText = statusMsg;
      }
      if (isError) {
        loaderIcon.innerText = '⚠️';
        retryBtn.style.display = 'inline-block';
        statusText.style.color = '#EF4444';
      }
    }

    const squatRequiredLandmarks = [11, 12, 23, 24, 25, 26, 27, 28];
    const squatKneeValues = [];
    const squatHipValues = [];
    const squatVisibilityValues = [];
    let squatState = 'TOP';
    let squatCandidate = null;
    let squatCandidateFrames = 0;
    let squatReps = 0;
    let squatReachedBottom = false;

    function squatAverage(values, nextValue) {
      values.push(nextValue);
      if (values.length > 5) values.shift();
      return values.reduce((sum, value) => sum + value, 0) / values.length;
    }

    function squatAngle(a, b, c) {
      const radians = Math.atan2(c.y - b.y, c.x - b.x) - Math.atan2(a.y - b.y, a.x - b.x);
      const degrees = Math.abs(radians * 180 / Math.PI);
      return degrees > 180 ? 360 - degrees : degrees;
    }

    function updateSquatUI(state, knee, hip, smoothVis) {
      const kEl = document.getElementById('squat-knee');
      const hEl = document.getElementById('squat-hip');
      const sEl = document.getElementById('squat-state');
      const rEl = document.getElementById('squat-reps');
      const dEl = document.getElementById('squat-depth');
      const pillEl = document.getElementById('squat-state-pill');
      const pillTxt = document.getElementById('squat-state-text');
      const pillEmoji = document.getElementById('squat-state-emoji');

      if (kEl) kEl.textContent = knee !== null ? knee.toFixed(1) + '°' : '--';
      if (hEl) hEl.textContent = hip !== null ? hip.toFixed(1) + '°' : '--';
      if (rEl) rEl.textContent = squatReps;

      if (sEl) {
        sEl.textContent = state;
        if (state === 'TOP') sEl.style.color = '#60A5FA';
        else if (state === 'DOWN') sEl.style.color = '#FBBF24';
        else if (state === 'BOTTOM') sEl.style.color = '#10B981';
      }

      if (dEl) {
        if (state === 'TOP') dEl.textContent = 'Standing Upright';
        else if (state === 'DOWN') dEl.textContent = squatReachedBottom ? 'Ascending ⬆️' : 'Descending ⬇️';
        else if (state === 'BOTTOM') dEl.textContent = 'Parallel Depth ✅';
      }

      if (pillEl && pillTxt && pillEmoji) {
        if (state === 'TOP') {
          pillEl.className = 'state-top';
          pillEmoji.textContent = '🟢';
          pillTxt.textContent = 'TOP';
        } else if (state === 'DOWN') {
          pillEl.className = 'state-down';
          pillEmoji.textContent = '🟡';
          pillTxt.textContent = squatReachedBottom ? 'DOWN (ASCENDING)' : 'DOWN (DESCENDING)';
        } else if (state === 'BOTTOM') {
          pillEl.className = 'state-bottom';
          pillEmoji.textContent = '🟣';
          pillTxt.textContent = 'BOTTOM (DEPTH OK)';
        }
      }
    }

    function trackSquat(pose) {
      const visible = Math.min(...squatRequiredLandmarks.map(index => pose[index].visibility || 1));
      const smoothVis = squatAverage(squatVisibilityValues, visible);
      const visEl = document.getElementById('squat-visibility');
      if (visEl) visEl.textContent = smoothVis.toFixed(2);

      if (smoothVis < 0.5) {
        squatCandidate = null;
        squatCandidateFrames = 0;
        updateSquatUI(squatState, null, null, smoothVis);
        return false;
      }

      const leftKnee = squatAngle(pose[23], pose[25], pose[27]);
      const rightKnee = squatAngle(pose[24], pose[26], pose[28]);
      const leftHip = squatAngle(pose[11], pose[23], pose[25]);
      const rightHip = squatAngle(pose[12], pose[24], pose[26]);
      const knee = squatAverage(squatKneeValues, (leftKnee + rightKnee) / 2);
      const hip = squatAverage(squatHipValues, (leftHip + rightHip) / 2);

      let instantState = knee <= 95 ? 'BOTTOM' : knee >= 155 ? 'TOP' : 'DOWN';
      
      let nextState = instantState;
      if (squatState === 'TOP') {
        nextState = knee >= 155 ? 'TOP' : 'DOWN';
      } else if (squatState === 'BOTTOM') {
        nextState = knee <= 100 ? 'BOTTOM' : 'DOWN';
      } else {
        if (knee <= 95) nextState = 'BOTTOM';
        else if (knee >= 155) nextState = 'TOP';
        else nextState = 'DOWN';
      }

      updateSquatUI(instantState, knee, hip, smoothVis);

      if (nextState === squatState) {
        squatCandidate = null;
        squatCandidateFrames = 0;
        return false;
      }

      squatCandidateFrames = nextState === squatCandidate ? squatCandidateFrames + 1 : 1;
      squatCandidate = nextState;
      if (squatCandidateFrames < 4) return false;

      if (nextState === 'BOTTOM') squatReachedBottom = true;
      const completed = nextState === 'TOP' && squatState === 'DOWN' && squatReachedBottom;
      if (completed) {
        squatReps += 1;
        const rEl = document.getElementById('squat-reps');
        if (rEl) rEl.textContent = squatReps;
      }
      if (nextState === 'TOP' && squatState === 'DOWN') {
        squatReachedBottom = false;
      }
      squatState = nextState;
      squatCandidate = null;
      squatCandidateFrames = 0;
      return completed;
    }

    async function loadScript(url) {
      return new Promise((resolve, reject) => {
        const script = document.createElement('script');
        script.src = url;
        script.crossOrigin = 'anonymous';
        script.onload = () => resolve();
        script.onerror = (e) => reject(new Error('Failed to load script: ' + url));
        document.head.appendChild(script);
      });
    }

    async function initApp() {
      try {
        setProgress(30, 'Loading Pose Model Assets...');

        if (typeof window.Camera === 'undefined') {
          try {
            await loadScript('/static/camera_utils.js');
          } catch (e) {
            await loadScript('https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils@0.3.1675466862/camera_utils.js');
          }
        }

        if (typeof window.Pose === 'undefined') {
          setProgress(50, 'Downloading Pose Tracker...');
          try {
            await loadScript('/static/pose.js');
          } catch (e) {
            await loadScript('https://cdn.jsdelivr.net/npm/@mediapipe/pose@0.5.1675469404/pose.js');
          }
        }

        if (typeof window.Pose === 'undefined') {
          throw new Error('Pose library failed to initialize');
        }

        const POSE_CONNECTIONS = [
          [0, 1], [1, 2], [2, 3], [3, 7], [0, 4], [4, 5], [5, 6], [6, 8], [9, 10],
          [11, 12], [11, 13], [13, 15], [15, 17], [15, 19], [15, 21], [17, 19],
          [12, 14], [14, 16], [16, 18], [16, 20], [16, 22], [18, 20],
          [11, 23], [12, 24], [23, 24], [23, 25], [24, 26], [25, 27], [26, 28],
          [27, 29], [28, 30], [29, 31], [30, 32], [27, 31], [28, 32]
        ];

        poseInstance = new window.Pose({
          locateFile: (file) => {
            setProgress(70, 'Loading Neural Weights: ' + file);
            return '/static/' + file;
          }
        });

        poseInstance.setOptions({
          modelComplexity: selectedComplexity,
          smoothLandmarks: true,
          enableSegmentation: false,
          minDetectionConfidence: 0.4,
          minTrackingConfidence: 0.4
        });

        let modelReady = false;

        poseInstance.onResults((results) => {
          if (!modelReady) {
            modelReady = true;
            setProgress(100, 'Backend Pose Model Loaded Successfully!');
            setTimeout(() => {
              loaderOverlay.style.opacity = '0';
              loaderOverlay.style.transform = 'scale(0.9)';
              setTimeout(() => { loaderOverlay.style.display = 'none'; }, 400);
            }, 300);
          }

          ctx.clearRect(0, 0, canvas.width, canvas.height);

          if (results.poseLandmarks && results.poseLandmarks.length > 0) {
            const landmarks = Array.isArray(results.poseLandmarks[0])
              ? results.poseLandmarks[0]
              : results.poseLandmarks;
            if (trackSquat(landmarks) && window.ReactNativeWebView) {
              window.ReactNativeWebView.postMessage(JSON.stringify({ type: 'SQUAT_REP', repCount: squatReps }));
            }
            ctx.lineWidth = 4.5;
            ctx.strokeStyle = '#6366F1';
            for (const [startIdx, endIdx] of POSE_CONNECTIONS) {
              const start = results.poseLandmarks[startIdx];
              const end = results.poseLandmarks[endIdx];
              if (start && end && (start.visibility || 1) > 0.3 && (end.visibility || 1) > 0.3) {
                ctx.beginPath();
                ctx.moveTo(start.x * canvas.width, start.y * canvas.height);
                ctx.lineTo(end.x * canvas.width, end.y * canvas.height);
                ctx.stroke();
              }
            }

            for (const lm of results.poseLandmarks) {
              if ((lm.visibility || 1) > 0.3) {
                ctx.beginPath();
                ctx.arc(lm.x * canvas.width, lm.y * canvas.height, 6.5, 0, 2 * Math.PI);
                ctx.fillStyle = '#10B981';
                ctx.fill();
                ctx.lineWidth = 2;
                ctx.strokeStyle = '#FFFFFF';
                ctx.stroke();
              }
            }

            if (window.ReactNativeWebView) {
              window.ReactNativeWebView.postMessage(JSON.stringify({
                type: 'POSE_DETECTED',
                count: results.poseLandmarks.length
              }));

              const now = Date.now();
              if (now - lastFramePostTime > 150) {
                lastFramePostTime = now;
                try {
                  if (!offscreenCanvas) {
                    offscreenCanvas = document.createElement('canvas');
                    offscreenCanvas.width = 320;
                    offscreenCanvas.height = 240;
                  }
                  const offCtx = offscreenCanvas.getContext('2d');
                  offCtx.drawImage(video, 0, 0, 320, 240);
                  const frameData = offscreenCanvas.toDataURL('image/jpeg', 0.4);
                  window.ReactNativeWebView.postMessage(JSON.stringify({
                    type: 'camera_frame',
                    frame: frameData
                  }));
                } catch (e) {}
              }
            }
          } else {
            if (window.ReactNativeWebView) {
              window.ReactNativeWebView.postMessage(JSON.stringify({
                type: 'NO_PERSON',
                count: 0
              }));
            }
          }
        });

        setProgress(85, 'Accessing Camera...');

        let currentFacingMode = 'user';
        let currentStream = null;

        function startCamera(facingMode) {
          if (currentStream) {
            currentStream.getTracks().forEach(track => track.stop());
          }

          const constraints = {
            video: {
              facingMode: facingMode,
              width: { ideal: 1280 },
              height: { ideal: 720 }
            },
            audio: false
          };

          if (navigator.mediaDevices && navigator.mediaDevices.getUserMedia) {
            navigator.mediaDevices.getUserMedia(constraints).then((stream) => {
              currentStream = stream;
              video.srcObject = stream;
              video.onloadedmetadata = () => {
                resizeCanvas();
              };
              video.play().catch((err) => console.warn('Camera playback could not start:', err));
              setProgress(95, 'Starting Neural Processing...');

              async function sendFrame() {
                if (video.readyState >= 2 && poseInstance) {
                  await poseInstance.send({ image: video });
                }
                requestAnimationFrame(sendFrame);
              }
              sendFrame();
            }).catch((err) => {
              setProgress(currentProgress, '⚠️ Camera Access Error: ' + err.message, true);
              console.error(err);
            });
          } else {
            setProgress(currentProgress, '⚠️ Camera access is not supported in this browser context', true);
          }
        }

        window.toggleFacingMode = function() {
          currentFacingMode = (currentFacingMode === 'user') ? 'environment' : 'user';
          startCamera(currentFacingMode);
        };

        window.setInitialComplexity = function(level) {
          selectedComplexity = level;
          if (poseInstance) {
            poseInstance.setOptions({
              modelComplexity: level,
              smoothLandmarks: true,
              minDetectionConfidence: 0.4,
              minTrackingConfidence: 0.4
            });
          }
        };

        startCamera(currentFacingMode);

      } catch (err) {
        const msg = err && err.message ? err.message : String(err);
        setProgress(currentProgress, '⚠️ Model Error: ' + msg, true);
        console.error(err);
      }
    }

    function resizeCanvas() {
      if (video && video.videoWidth && video.videoHeight) {
        canvas.width = video.videoWidth;
        canvas.height = video.videoHeight;
      } else {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
      }
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    initApp();
  </script>
</body>
</html>
